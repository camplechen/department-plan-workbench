<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 部门计划工作台</title><link rel="stylesheet" href="/style.css"></head>
<body class="login-page"><main class="login-card"><div class="brand"><b>序</b><strong>部门计划工作台</strong></div><h1>欢迎回来</h1><p>登录后查看计划、推进工作。</p><form id="login-form"><label>账号<input name="username" autocomplete="username" required maxlength="40" autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="login-error" class="form-error" role="alert"></p><button class="primary" type="submit">登录工作台</button></form><p class="login-note">账号由管理员分配 · 登录状态保持 30 天<br>共用电脑使用后请点击退出登录。</p></main><script src="/login.js" type="module"></script></body></html>
