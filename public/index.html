<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>部门计划工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><div class="brand"><b>序</b><strong>部门计划工作台</strong></div><div class="space">部门协作空间</div><nav><button data-view="plans" class="active">▦ <span>部门工作计划</span></button><button data-view="bases">▤ <span>制定依据库</span></button><button data-view="users" id="users-nav" hidden>♙ <span>用户管理</span></button></nav><div class="side-note"><span class="dot"></span> 本地工作空间<p>让每一项计划，都有据可依。</p></div></aside>
<main><header><span id="breadcrumb">工作台 <i>/</i> 部门工作计划</span><div class="session-bar"><span class="local">仅本机使用</span><span id="current-user"></span><button id="logout">退出登录</button></div></header><section class="content"><div class="heading"><div><div class="eyebrow">计划与行动 · 有序推进</div><h1 id="page-title">部门工作计划</h1><p id="subtitle">把部门目标转化为行动，让制定依据与计划紧密相连。</p></div><button class="primary" id="create">＋ 新建计划</button></div><div id="stats" class="stats"></div><div class="panel"><div class="toolbar"><div class="tabs"><button id="all-tab" class="selected">全部计划</button><button id="group-tab">按依据查看</button></div><button id="export">↓ 导出计划</button></div><div class="filters"><input id="search" aria-label="搜索" placeholder="搜索计划、负责人、部门…"><select id="status" aria-label="状态筛选"><option value="">全部状态</option><option>草稿</option><option>进行中</option><option>已完成</option><option>已暂停</option><option>已逾期</option></select><select id="department" aria-label="部门筛选"><option value="">全部部门</option></select><select id="category" aria-label="依据分类筛选"><option value="">全部依据分类</option><option>战略目标</option><option>经营数据</option><option>上级要求</option><option>问题改进</option><option>其他</option></select><span id="count"></span></div><div id="list"></div></div><footer>部门计划制定 / 根据 <span>数据保存在当前电脑 · 保存后即时生效</span></footer></section></main>
<dialog id="user-editor"><form id="user-form"><div class="dialog-head"><div><small>账号由管理员统一分配</small><h2 id="user-dialog-title">新建用户</h2></div><button type="button" data-close aria-label="关闭">×</button></div><div class="fields"><label>账号 *<input name="username" required minlength="3" maxlength="40" pattern="[-a-zA-Z0-9_.]{3,40}" autocomplete="off"><small>3 至 40 位字母、数字、点、下划线或连字符</small></label><label>显示名称<input name="displayName" maxlength="100" autocomplete="off"></label><label>密码<input name="password" type="password" minlength="4" maxlength="128" autocomplete="new-password"><small id="password-help"></small></label><label>角色<select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label><label>状态<select name="enabled"><option value="true">启用</option><option value="false">停用</option></select></label></div><p id="user-form-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">保存用户</button></div></form></dialog><dialog id="editor"><form id="form"><div class="dialog-head"><div><small>部门协作空间</small><h2 id="dialog-title"></h2></div><button type="button" data-close aria-label="关闭">×</button></div><div id="fields" class="fields"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" type="submit">保存</button></div></form></dialog><dialog id="detail"><div id="detail-content"></div><div class="dialog-actions"><button data-close>关闭</button></div></dialog><div id="toast" role="status"></div><script src="/vendor/tinymce/tinymce.min.js"></script><script src="/app.js" type="module"></script></body></html>
